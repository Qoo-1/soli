<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#edfaff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Soli">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/soli-icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<title>Soli · 夏日奇冰</title>
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-mark">soli</div>
  <div class="boot-line"></div>
</div>

<div class="phone" id="app">
  <header class="status"><span id="clock">--:--</span><span class="status-right"><i></i><i></i><i></i></span></header>
  <main id="screen"></main>
  <nav id="nav"></nav>
</div>

<div id="fatal" class="fatal" hidden>
  <div>
    <b id="fatalTitle">Soli 无法启动</b>
    <p id="fatalText">页面已经加载，但 Soli 的核心程序没有成功启动。</p>
    <div id="diagnostics" class="diagnostics"></div>
    <div class="fatal-actions">
      <button id="fatalReload">重新加载</button>
      <button id="fatalReset" class="secondary">清除本机缓存并重试</button>
    </div>
  </div>
</div>

<script>
(function(){
  const state = { html:"OK", css:"OK", store:"等待", icons:"等待", engine:"等待", app:"等待", serviceWorker:"等待" };
  window.__soliDiagnostics = state;

  function renderDiagnostics(errorText){
    const fatal = document.getElementById("fatal");
    const diagnostics = document.getElementById("diagnostics");
    const text = document.getElementById("fatalText");
    if (!fatal || !diagnostics) return;
    fatal.hidden = false;
    if (errorText) text.textContent = "页面已经加载，但 Soli 的核心程序没有成功启动。";
    diagnostics.innerHTML =
      Object.entries(state).map(([k,v]) =>
        '<div><span>' + k + '</span><strong class="' + (v === "OK" ? "ok" : "bad") + '">' +
        String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) +
        '</strong></div>'
      ).join("") +
      (errorText ? '<pre>' + String(errorText).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>' : '');
    document.getElementById("boot")?.classList.add("hide");
  }

  window.__soliFail = function(error, source){
    state[source || "app"] = "ERROR";
    renderDiagnostics(error && (error.stack || error.message || String(error)));
  };

  window.addEventListener("error", function(e){
    if (e && e.error) window.__soliFail(e.error, "app");
  });
  window.addEventListener("unhandledrejection", function(e){
    window.__soliFail(e.reason || "Unhandled Promise rejection", "app");
  });

  window.addEventListener("load", function(){
    setTimeout(function(){
      if (!window.__soliReady) {
        state.app = "TIMEOUT";
        renderDiagnostics("Soli 初始化超时。请检查 js 文件路径、Service Worker 缓存或浏览器控制台错误。");
      }
    }, 6000);
  });

  document.getElementById("fatalReload")?.addEventListener("click", () => location.reload());
  document.getElementById("fatalReset")?.addEventListener("click", async () => {
    try {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(r => r.unregister()));
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => k.startsWith("soli-summer-ice-")).map(k => caches.delete(k)));
      }
      location.reload();
    } catch (e) {
      renderDiagnostics(e);
    }
  });
})();
</script>

<script src="js/store.js"></script>
<script>
  if (window.SoliStore) window.__soliDiagnostics.store = "OK";
</script>
<script src="js/icons.js"></script>
<script>
  if (window.SoliIcons) window.__soliDiagnostics.icons = "OK";
</script>
<script src="js/engine.js"></script>
<script>
  if (window.SoliEngine) window.__soliDiagnostics.engine = "OK";
</script>
<script src="js/app.js"></script>
</body>
</html>
